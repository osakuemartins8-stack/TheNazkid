<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheNazkid Analytics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        .login-container h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .login-container p {
            color: #666;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .dashboard {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 1200px;
            padding: 40px;
            display: none;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .dashboard-header h1 {
            color: #333;
            font-size: 32px;
        }

        .logout-btn {
            padding: 10px 24px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .song-info {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 40px;
            padding: 30px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 16px;
            flex-wrap: wrap;
        }

        .cover-art {
            width: 150px;
            height: 150px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            object-fit: cover;
        }

        .song-details h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .song-details p {
            color: #666;
            font-size: 18px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 24px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .stat-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .platform-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 18px;
        }

        .stat-card h3 {
            color: #333;
            font-size: 18px;
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #999;
            font-size: 14px;
        }

        .total-streams {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .total-streams h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .total-streams .stat-number {
            color: white;
            font-size: 48px;
        }

        .update-info {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .dashboard {
                padding: 20px;
            }

            .song-info {
                flex-direction: column;
                text-align: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-container" id="loginScreen">
        <h1>TheNazkid Analytics</h1>
        <p>Sign in to view your streaming statistics</p>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
            <div class="error-message" id="errorMessage">Invalid username or password</div>
        </form>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="dashboard-header">
            <h1>Analytics Dashboard</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="song-info">
            <img src="cover.png" alt="Only one for me" class="cover-art" id="coverArt">
            <div class="song-details">
                <h2>Only one for me</h2>
                <p>by TheNazkid</p>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <!-- Stats will be dynamically inserted here -->
        </div>

        <div class="total-streams">
            <h2>Total Streams</h2>
            <div class="stat-number" id="totalStreams">0</div>
        </div>

        <div class="update-info" id="updateInfo">
            Next update in: Calculating...
        </div>
    </div>

    <script>
        // Platform configurations
        const platforms = [
            { name: 'Apple Music', color: '#fa233b', initial: 4 },
            { name: 'Audiomack', color: '#ff8800', initial: 4 },
            { name: 'Spotify', color: '#1DB954', initial: 2 },
            { name: 'Boomplay', color: '#ff6b35', initial: 3 },
            { name: 'Deezer', color: '#a238ff', initial: 1 },
            { name: 'YouTube Music', color: '#ff0000', initial: 2 },
            { name: 'Tidal', color: '#000000', initial: 1 },
            { name: 'Amazon Music', color: '#00a8e1', initial: 3 }
        ];

        // Initialize analytics data
        function initializeData() {
            const stored = localStorage.getItem('nazkidAnalytics');
            if (stored) {
                return JSON.parse(stored);
            }

            const now = Date.now();
            const data = {
                platforms: {},
                startTime: now,
                lastUpdate: now,
                updateCount: 0
            };

            platforms.forEach(platform => {
                data.platforms[platform.name] = platform.initial;
            });

            localStorage.setItem('nazkidAnalytics', JSON.stringify(data));
            return data;
        }

        // Get random increment (2-8)
        function getRandomIncrement() {
            return Math.floor(Math.random() * 7) + 2; // Random number from 2 to 8
        }

        // Update streams
        function updateStreams() {
            const data = initializeData();
            const now = Date.now();
            const timeSinceStart = now - data.startTime;
            const twoDays = 2 * 24 * 60 * 60 * 1000; // 2 days in milliseconds
            const fiveHours = 5 * 60 * 60 * 1000; // 5 hours in milliseconds

            // Check if 2 days have passed since start
            if (timeSinceStart < twoDays) {
                renderDashboard(data);
                return;
            }

            // Check if 5 hours have passed since last update
            const timeSinceLastUpdate = now - data.lastUpdate;
            if (timeSinceLastUpdate >= fiveHours) {
                // Update each platform
                platforms.forEach(platform => {
                    const increment = getRandomIncrement();
                    data.platforms[platform.name] += increment;
                });

                data.lastUpdate = now;
                data.updateCount++;
                localStorage.setItem('nazkidAnalytics', JSON.stringify(data));
            }

            renderDashboard(data);
        }

        // Render dashboard
        function renderDashboard(data) {
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = '';

            let total = 0;
            platforms.forEach(platform => {
                const streams = data.platforms[platform.name] || 0;
                total += streams;

                const card = document.createElement('div');
                card.className = 'stat-card';
                card.innerHTML = `
                    <div class="stat-card-header">
                        <div class="platform-icon" style="background: ${platform.color}">
                            ${platform.name.charAt(0)}
                        </div>
                        <h3>${platform.name}</h3>
                    </div>
                    <div class="stat-number">${streams.toLocaleString()}</div>
                    <div class="stat-label">Total Streams</div>
                `;
                statsGrid.appendChild(card);
            });

            document.getElementById('totalStreams').textContent = total.toLocaleString();
            updateTimer(data);
        }

        // Update timer display
        function updateTimer(data) {
            const now = Date.now();
            const timeSinceStart = now - data.startTime;
            const twoDays = 2 * 24 * 60 * 60 * 1000;
            const fiveHours = 5 * 60 * 60 * 1000;

            const updateInfo = document.getElementById('updateInfo');

            if (timeSinceStart < twoDays) {
                const timeUntilFirstUpdate = twoDays - timeSinceStart;
                const hours = Math.floor(timeUntilFirstUpdate / (60 * 60 * 1000));
                const minutes = Math.floor((timeUntilFirstUpdate % (60 * 60 * 1000)) / (60 * 1000));
                updateInfo.textContent = `First update in: ${hours}h ${minutes}m (Updates start after 2 days)`;
            } else {
                const timeSinceLastUpdate = now - data.lastUpdate;
                const timeUntilNextUpdate = fiveHours - timeSinceLastUpdate;
                
                if (timeUntilNextUpdate > 0) {
                    const hours = Math.floor(timeUntilNextUpdate / (60 * 60 * 1000));
                    const minutes = Math.floor((timeUntilNextUpdate % (60 * 60 * 1000)) / (60 * 1000));
                    updateInfo.textContent = `Next update in: ${hours}h ${minutes}m`;
                } else {
                    updateInfo.textContent = 'Updating...';
                }
            }
        }

        // Login handling
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username === 'TheNazkid' && password === 'TheNazkid2013') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                localStorage.setItem('nazkidLoggedIn', 'true');
                updateStreams();
            } else {
                document.getElementById('errorMessage').style.display = 'block';
            }
        });

        // Logout function
        function logout() {
            localStorage.removeItem('nazkidLoggedIn');
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('errorMessage').style.display = 'none';
        }

        // Check if already logged in
        window.addEventListener('load', function() {
            if (localStorage.getItem('nazkidLoggedIn') === 'true') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                updateStreams();
            }

            // Handle missing cover image
            document.getElementById('coverArt').addEventListener('error', function() {
                this.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                this.alt = 'Cover art not found';
            });
        });

        // Update timer every minute
        setInterval(function() {
            if (document.getElementById('dashboard').style.display === 'block') {
                updateStreams();
            }
        }, 60000); // Update every minute
    </script>
</body>

</html>
